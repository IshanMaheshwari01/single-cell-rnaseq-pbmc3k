name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download the 10x dataset
        run: bash data/download_data.sh

      - name: Run the pipeline
        run: python -m src.run_pipeline

      - name: Check the outputs
        run: |
          test -f results/marker_genes.csv
          test -f results/celltype_counts.csv
          test -f results/cluster_celltype_mapping.csv
          test "$(ls figures/*.png | wc -l)" -eq 13
